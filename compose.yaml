name: project-delivery-hub
services:
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.40.5}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Europe/Berlin
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/files/data:ro
      - ./output:/files/output:ro
    depends_on:
      hub-api:
        condition: service_healthy
  hub-api:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DEMO_AS_OF: ${DEMO_AS_OF:-2026-09-23}
      NOTIFICATION_MODE: ${NOTIFICATION_MODE:-dry-run}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - ./data:/data:ro
      - ./output:/output
      - hub_state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  n8n_data:
    external: true
    name: n8n_data
  hub_state:
